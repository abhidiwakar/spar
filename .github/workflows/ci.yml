name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npx tsc --noEmit
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  version:
    needs: test
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Bump version
        id: version
        run: |
          version=$(python3 scripts/bump_version.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version"

      - name: Commit version
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "Release v${{ steps.version.outputs.version }} [skip ci]"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: windows-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "Add APPLE_CERTIFICATE and the other Apple secrets. See docs/macos-signing.md"
            exit 1
          fi
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f "$RUNNER_TEMP/certificate.p12"
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -n1)
          if [ -z "$CERT_INFO" ]; then
            echo "No Developer ID Application identity in the certificate. Export that cert, not Apple Development."
            security find-identity -v -p codesigning build.keychain
            exit 1
          fi
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"
          echo "Imported $CERT_ID"

      - name: Prepare Apple notarization credentials
        if: runner.os == 'macOS'
        env:
          RAW_APPLE_ID: ${{ vars.APPLE_ID }}
          RAW_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          RAW_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          id=$(printf '%s' "$RAW_APPLE_ID" | tr -d '\r\n[:space:]')
          team=$(printf '%s' "$RAW_APPLE_TEAM_ID" | tr -d '\r\n[:space:]')
          pass=$(printf '%s' "$RAW_APPLE_PASSWORD" | tr -d '\r\n')
          if [ -z "$id" ] || [ -z "$team" ] || [ -z "$pass" ]; then
            echo "APPLE_ID, APPLE_TEAM_ID, or APPLE_PASSWORD is empty in GitHub Actions."
            exit 1
          fi
          {
            echo "APPLE_ID=$id"
            echo "APPLE_TEAM_ID=$team"
            echo "APPLE_PASSWORD<<PW"
            printf '%s\n' "$pass"
            echo "PW"
          } >> "$GITHUB_ENV"
          echo "APPLE_ID length=${#id} team_id length=${#team} password length=${#pass}"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Spar v__VERSION__
          releaseBody: |
            macOS Apple Silicon (`.dmg`, signed and notarized) and Windows (`.exe` / `.msi`).

            The Microsoft Store upload is an unsigned `.msix` (see docs/msix-store.md).
            Windows SmartScreen may warn on the GitHub `.exe` / `.msi`.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Ensure Windows SDK (makeappx)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $found = Get-ChildItem $kits -Recurse -Filter makeappx.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq "x64" } |
            Select-Object -First 1
          if ($found) {
            Write-Host "Found $($found.FullName)"
            exit 0
          }
          Write-Host "Installing Windows SDK so makeappx.exe is available"
          winget install --id Microsoft.WindowsSDK.10.0.26100 --exact --accept-package-agreements --accept-source-agreements
          $found = Get-ChildItem $kits -Recurse -Filter makeappx.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq "x64" } |
            Select-Object -First 1
          if (-not $found) { throw "makeappx.exe still missing after Windows SDK install." }
          Write-Host "Found $($found.FullName)"

      - name: Pack unsigned MSIX
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/pack_msix.ps1
          $built = Get-ChildItem src-tauri/target/release/bundle/msix/*.msix -ErrorAction SilentlyContinue
          if (-not $built) { throw "pack_msix.ps1 finished but no .msix was written." }
          Get-ChildItem src-tauri/target/release/bundle/msix/*.msix | ForEach-Object { $_.FullName }

      - name: Upload MSIX artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: spar-msix
          path: src-tauri/target/release/bundle/msix/*.msix
          if-no-files-found: error

      - name: Attach MSIX to release
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          files: src-tauri/target/release/bundle/msix/*.msix
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
