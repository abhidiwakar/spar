name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  macos:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Bump version
        id: version
        run: |
          version=$(python3 scripts/bump_version.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version"

      - name: Commit version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Version files already at v${{ steps.version.outputs.version }}"
            exit 0
          fi
          git commit -m "Release v${{ steps.version.outputs.version }} [skip ci]"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Spar v__VERSION__
          releaseBody: |
            Apple Silicon macOS build.

            The app is not notarized. To open: right-click the app → Open.
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin
